<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 3 - Landing Page</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a href="#" class="navbar-brand fw-bold">
                MinhaMarca
            </a>

            <!-- Botão das três barras -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a href="#" class="nav-link active">Início</a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link">Recursos</a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link">Contato</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Hero section -->
    <header class="bg-primary text-white py-5">

        <div class="container py-5">

            <div class="row align-items-center">

                <div class="col-lg-7">

                    <h1 class="display-4 fw-bold">
                        Construa sites rápidos com Bootstrap
                    </h1>

                    <p class="lead my-4">
                        Domine componentes prontos, menus responsivos e alinhamento com Flexbox de forma simples e
                        direta.
                    </p>

                    <button class="btn btn-light btn-lg fw-semibold">
                        Começar agora
                    </button>

                </div>

                <div class="col-lg-5 text-center mt-4 mt-lg-0">

                    <img src="https://placehold.co/450x300" alt="Destaque" class="img-fluid rounded shadow">

                </div>

            </div>

        </div>

    </header>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
