<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 05 - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container my-5">
        
        <!-- Alerta de Boas-Vindas -->
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>Bem-Vindo!!!</strong> Você chegou ao projeto final da trilha de bootStrap.
            <button class="btn-close" type="button" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Cabeçalho com botão do modal -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestão de projetos</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoProjeto">
                + Novo Projeto
            </button>
        </div>

        <!-- Card com a Tabela Responsiva -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Projeto</th>
                            <th>Categoria</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>01</td>
                            <td>Cartão de Perfil</td>
                            <td>Containers e Espaçamento</td>
                            <td><span class="badge bg-success">Concluído</span></td>
                            <td><button class="btn btn-sm btn-outline-primary">Ver</button></td>
                        </tr>
                        <tr>
                            <td>02</td>
                            <td>Galeria</td>
                            <td>Sistema de Grid (12 colunas)</td>
                            <td><span class="badge bg-success">Concluído</span></td>
                            <td><button class="btn btn-sm btn-outline-primary">Ver</button></td>
                        </tr>
                        <tr>
                            <td>05</td>
                            <td>Dashboard</td>
                            <td>Modais, Tabelas e Componentes JS</td>
                            <td><span class="badge bg-warning text-dark">Em andamento</span></td>
                            <td><button class="btn btn-sm btn-outline-primary">Ver</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>

</html>
